name: dorsal

x-backend: &backend
  build: ./backend
  environment:
    POSTGRES_DB: dorsal
    POSTGRES_USER: dorsal
    POSTGRES_PASSWORD: dorsal
    POSTGRES_HOST: db
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    CELERY_TASK_ALWAYS_EAGER: "false"
    NOTIFIER_BASE_URL: http://notificador:9000
    DJANGO_MEDIA_ROOT: /data/media
    # Evita que pytest y ruff dejen cachés de root en la carpeta montada.
    PYTEST_ADDOPTS: "-p no:cacheprovider"
    RUFF_NO_CACHE: "true"
  volumes:
    - ./backend:/app
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dorsal
      POSTGRES_USER: dorsal
      POSTGRES_PASSWORD: dorsal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorsal -d dorsal"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notificador:
    image: python:3.12-slim
    command: ["python", "/app/server.py"]
    environment:
      NOTIFIER_PORT: "9000"
    volumes:
      - ./notificador:/app:ro
    ports:
      - "9000:9000"

  backend:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
